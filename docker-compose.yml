services:
  postgres:
    image: postgres:16-alpine
    container_name: darsly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darsly
      POSTGRES_PASSWORD: darsly_dev_password
      POSTGRES_DB: darsly
    ports:
      - '5434:5432'
    volumes:
      - darsly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U darsly -d darsly']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for video/attachments (dev).
  # Production swaps this for real S3/Spaces/R2 via the same StorageProvider interface.
  minio:
    image: minio/minio:latest
    container_name: darsly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: darsly
      MINIO_ROOT_PASSWORD: darsly_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - darsly_minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared state across the two production replicas: distributed login/
  # forgot-password rate limiting and the Socket.IO room adapter both read
  # this. A single local instance works fine without it (both fall back to
  # in-memory, which is correct with one process) — this is here so local
  # dev/testing can exercise the real distributed path if you want to.
  redis:
    image: redis:7-alpine
    container_name: darsly-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - darsly_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  darsly_pgdata:
  darsly_minio:
  darsly_redis:
