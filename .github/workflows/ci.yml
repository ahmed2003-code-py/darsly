# Continuous integration.
#
# Until this existed, 1,500+ tests could not stop a broken deploy: Railway
# builds straight from `main`, so the first thing to run the suite was a human
# who remembered to. Two real failures were sitting in `main` when this was
# written (a drifted local schema and a dependency declared but never
# installed) — both are exactly what a pipeline catches on the day they appear.
#
# Ordering is cheapest-first: a syntax error should not wait for the test
# suite to report itself.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # redis-memory-server's postinstall compiles a real Redis binary and
      # needs `make`, which this image does not guarantee. Its own maintainers
      # ship this switch for CI; the Dockerfile sets it for the same reason.
      # Without it `npm ci` aborts and leaves sibling packages unwritten.
      REDISMS_DISABLE_POSTINSTALL: '1'
      # config.validation.ts refuses to load on placeholder secrets. Nothing
      # here binds a port, but importing the app module in a spec still reads
      # them, so they are real-shaped and CI-only.
      JWT_ACCESS_SECRET: ci-access-secret-not-a-real-key-32ch
      JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-key-32c
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches package.json "engines"
          cache: npm

      - name: Install
        run: npm ci

      # The Prisma client is generated, not committed, so every later step
      # that imports it needs this first.
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma

      - name: Typecheck API
        run: npx tsc -p apps/api/tsconfig.json --noEmit

      - name: Typecheck web
        run: npx tsc -p apps/web/tsconfig.json --noEmit

      # Blocking. Every preset rule is still `warn` rather than `error` (see
      # eslint.config.mjs), so this passes on 614 warnings and fails only on an
      # error — which today means a syntax error, an unknown rule named in a
      # disable comment, or a rule somebody has deliberately promoted. That is
      # a real gate: it cannot be green while the repo does not parse.
      - name: Lint
        run: npm run lint

      # Blocking. The 530 unformatted files this used to report were formatted
      # in one pass, so from here a pull request that arrives unformatted is a
      # failure rather than a warning nobody reads.
      - name: Format check
        run: npm run format:check

      # No Postgres service container on purpose: the integration specs skip
      # themselves when DATABASE_URL is unreachable, which keeps this job at
      # roughly half a minute. Wiring a real database is its own change.
      # Jest is invoked directly, from apps/api, rather than through `npm test`.
      #
      # The root script is `npm run test --workspace=apps/api`, so
      # `npm test -- --maxWorkers=2` hands the flag to the OUTER npm, which
      # treats it as an npm option and runs a bare `jest`. Verified: the same
      # command with `--testPathPattern=zzz-does-not-exist` still ran all 1,539
      # tests. The pin was a silent no-op.
      #
      # It is worth pinning for real: Jest's default is cores - 1, which is a
      # property of whatever machine picks up the job, and on a larger runner
      # it forks enough workers to exhaust memory — the suite was OOM-killed
      # (exit 137) exactly this way while this file was written.
      - name: Test
        working-directory: apps/api
        run: npx jest --maxWorkers=2

      # The guard chain over real HTTP. Separate from the step above because it
      # is a separate Jest project: `npm test` has rootDir `src`, this has
      # `apps/api/test`, and neither picks up the other's files.
      #
      # It needs nothing external. The suite boots a Nest app in-process and
      # drives it with supertest over an ephemeral local port, stubs
      # PrismaService outright, and sets its own JWT secret — so it cannot
      # reach a database, and it cannot reach production.
      - name: E2E (authorization matrix)
        working-directory: apps/api
        run: npm run test:e2e

      - name: Build
        run: npm run build

      # The last step still allowed to fail, and the only one. 11 high-severity
      # advisories remain, all inside multer and path-to-regexp, reachable only
      # by upgrading NestJS 10 to 12 — 11.x still pins multer 2.0.2. That is a
      # framework upgrade with an Express 4 to 5 migration inside it, decided
      # against for now (ARCHITECTURE_REVIEW.md §11 #7), not an oversight.
      # It becomes blocking the day that upgrade lands.
      - name: Audit
        continue-on-error: true
        run: npm audit --audit-level=high
