org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ── App configuration (override per environment, e.g. in ~/.gradle/gradle.properties
#    or on the command line: -PdarslyApiBaseUrl=https://api.example.com/api/v1/) ──
# MUST end with a trailing slash. MUST be https:// for release builds — the app
# refuses to build a release against a cleartext URL (see app/build.gradle.kts).
darslyApiBaseUrl=https://api.darsly.app/api/v1/

# Debug builds may point at a local backend over cleartext (emulator host alias).
darslyApiBaseUrlDebug=http://10.0.2.2:4000/api/v1/
